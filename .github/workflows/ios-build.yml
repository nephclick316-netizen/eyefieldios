name: Build iOS IPA

on:
  push:
    branches: [ main, master ] # Triggers the build whenever you push to main/master
  workflow_dispatch: # Allows you to trigger the build manually from GitHub

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Makes the gradlew file executable on the Linux/Mac runner
      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      # Builds the KMP Kotlin shared multiplatform framework code
      - name: Build KMP Shared Framework
        run: ./gradlew :sharedUI:linkReleaseFrameworkIosArm64

      # Compiles the actual iOS App wrapper
      - name: Build Xcode Project
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     OBJROOT=$PWD/build/obj \
                     SYMROOT=$PWD/build/sym

      # Packages the .app into a standard .ipa file
      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/sym/Release-iphoneos/iosApp.app Payload/
          zip -r EyeField.ipa Payload

      # Saves the final .ipa file so you can download it to Windows
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMP-iOS-App
          path: EyeField.ipa
